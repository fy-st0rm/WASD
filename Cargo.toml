[package]
name = "wasd"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1"
dirs = "7.0.0"
flume = "0.12.0"
image = "0.25.10"
libc = "0.2.189"
libjpeg-turbo-rs = { version = "0.8.0", features = ["simd"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.5"
x11rb = { version = "0.14.0", features = ["shm", "libc", "xfixes"] }
