<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WASD</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        #screen {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }

        body.rotated #screen {
            position: absolute;
            width: 100vh;
            height: 100vw;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                rotate(var(--rotation));
        }

        #stats {
            position: fixed;
            top: 20px;
            left: 20px;

            padding: 10px 16px;

            color: white;
            background: rgba(0, 0, 0, 0.7);

            font-family: monospace;
            font-size: 22px;

            border-radius: 8px;

            z-index: 10;
        }

        #fullscreen {
            position: fixed;
            top: 20px;
            right: 20px;

            padding: 14px 20px;

            color: white;
            background: rgba(0, 0, 0, 0.7);

            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;

            font-size: 20px;

            cursor: pointer;

            z-index: 10;
        }

        /* Hide UI while fullscreen */
        :fullscreen #stats,
        :fullscreen #fullscreen {
            display: none;
        }
    </style>

    <script src="https://unpkg.com/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>

</head>

<body>

<div id="stats">
    FPS: 0
</div>

<button id="fullscreen">
    Fullscreen
</button>

<canvas id="screen"></canvas>

<script>
    const noSleep = new NoSleep();

    const ROTATION = __ROTATION__;

    const canvas = document.getElementById("screen");
    const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
    const stats = document.getElementById("stats");
    const fullscreenButton = document.getElementById("fullscreen");

    /*
     * Rotation
     */
    if (ROTATION !== 0) {
        document.body.classList.add("rotated");
        document.body.style.setProperty(
            "--rotation",
            `${ROTATION}deg`
        );
    }

    /*
     * Fullscreen
     */
    fullscreenButton.onclick = async () => {
        try {
            noSleep.enable();
            await document.documentElement.requestFullscreen();
        } catch (error) {
            console.error("Fullscreen failed:", error);
        }
    };

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
            noSleep.enable();
            requestNextFrame();
        } else {
            clearTimeout(ackTimeout);
        }
    });

    /*
     * Low-latency flow-controlled display
     */
    const socket =
        new WebSocket("ws://" + location.host + "/ws");

    socket.binaryType = "arraybuffer";

    let ackTimeout = null;

    // Ring buffer: keep only the latest 2 frames to avoid head-of-line blocking.
    const frameQueue = [];
    const MAX_QUEUE = 2;

    let frames = 0;
    let lastFpsTime = performance.now();
    let rafScheduled = false;

    function requestNextFrame() {
        if (socket.readyState === WebSocket.OPEN) {
            socket.send("ack");

            // Safety watchdog: recover if a frame or ACK was dropped
            clearTimeout(ackTimeout);
            ackTimeout = setTimeout(() => {
                if (socket.readyState === WebSocket.OPEN) {
                    requestNextFrame();
                }
            }, 1000);
        }
    }

    function scheduleRender() {
        if (!rafScheduled) {
            rafScheduled = true;
            requestAnimationFrame(renderFrame);
        }
    }

    function renderFrame() {
        rafScheduled = false;
        if (frameQueue.length === 0) return;

        // Drop stale frames; only render the newest.
        const bitmap = frameQueue[frameQueue.length - 1];
        // Close any skipped frames.
        for (let i = 0; i < frameQueue.length - 1; i++) {
            frameQueue[i].close();
        }
        frameQueue.length = 0;

        if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
            canvas.width = bitmap.width;
            canvas.height = bitmap.height;
        }

        ctx.drawImage(bitmap, 0, 0);
        bitmap.close();
        frames++;

        requestNextFrame();
    }

    socket.onopen = () => {
        console.log("Connected");
        requestNextFrame();
    };

    const useImageDecoder = typeof ImageDecoder !== "undefined";

    socket.onmessage = async (event) => {
        clearTimeout(ackTimeout);

        try {
            let bitmap;
            if (useImageDecoder) {
                // ImageDecoder is faster: no Blob GC overhead, decoded off main thread.
                const decoder = new ImageDecoder({
                    type: "image/jpeg",
                    data: event.data,
                });
                const { image } = await decoder.decode();
                bitmap = image;
                decoder.close();
            } else {
                bitmap = await createImageBitmap(
                    new Blob([event.data], { type: "image/jpeg" })
                );
            }

            // Evict oldest frame if queue is full.
            if (frameQueue.length >= MAX_QUEUE) {
                frameQueue.shift().close();
            }
            frameQueue.push(bitmap);
            scheduleRender();
        } catch (error) {
            console.error("Decode error:", error);
            requestNextFrame();
        }
    };

    /*
     * FPS counter
     */
    setInterval(() => {
        const now = performance.now();

        const elapsed =
            now - lastFpsTime;

        const fps =
            frames * 1000 / elapsed;

        stats.textContent =
            "FPS: " + fps.toFixed(1);

        frames = 0;
        lastFpsTime = now;
    }, 1000);

    socket.onclose = () => {
        console.log("Disconnected");
        clearTimeout(ackTimeout);
    };

    socket.onerror = (error) => {
        console.error("WebSocket error:", error);
        clearTimeout(ackTimeout);
    };
</script>

</body>
</html>
