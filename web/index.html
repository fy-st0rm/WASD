<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MASD</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        #screen {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }

        body.rotated #screen {
            position: absolute;
            width: 100vh;
            height: 100vw;
            left: 50%;
            top: 50%;
            transform:
                translate(-50%, -50%)
                rotate(var(--rotation));
        }

        #stats {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 16px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            font-family: monospace;
            font-size: 22px;
            border-radius: 8px;
            z-index: 10;
        }

        #fullscreen {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
        }

        :fullscreen #stats,
        :fullscreen #fullscreen {
            display: none;
        }
    </style>

    <script src="https://unpkg.com/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
</head>

<body>

<div id="stats">FPS: 0</div>

<button id="fullscreen">
    Fullscreen
</button>

<img id="screen">

<script>
    const noSleep = new NoSleep();

    const ROTATION = __ROTATION__;

    const image = document.getElementById("screen");
    const stats = document.getElementById("stats");
    const fullscreenButton =
        document.getElementById("fullscreen");


    // ------------------------------------------------------------
    // KIOSK MODE
    // ------------------------------------------------------------

    const kiosk =
        new URLSearchParams(location.search).has("kiosk");


    // ------------------------------------------------------------
    // ROTATION
    // ------------------------------------------------------------

    if (ROTATION !== 0) {
        document.body.classList.add("rotated");

        document.body.style.setProperty(
            "--rotation",
            `${ROTATION}deg`
        );
    }


    // ------------------------------------------------------------
    // FULLSCREEN
    // ------------------------------------------------------------

    function updateFullscreenButton() {
        if (kiosk) {
            fullscreenButton.style.display = "none";
            stats.style.display = "none";
            return;
        }

        const fullscreen = document.fullscreenElement;

        fullscreenButton.style.display =
            fullscreen ? "none" : "block";

        stats.style.display =
            fullscreen ? "none" : "block";
    }

    updateFullscreenButton();

    document.addEventListener(
        "fullscreenchange",
        updateFullscreenButton
    );


    fullscreenButton.onclick = async () => {
        try {
            noSleep.enable();

            await document.documentElement.requestFullscreen();

        } catch (error) {
            console.error(
                "Fullscreen failed:",
                error
            );
        }
    };


    // ------------------------------------------------------------
    // KEEP SCREEN AWAKE
    // ------------------------------------------------------------

    document.addEventListener(
        "visibilitychange",
        () => {
            if (document.visibilityState === "visible") {
                noSleep.enable();
            }
        }
    );


    // ------------------------------------------------------------
    // FRAME DISPLAY
    // ------------------------------------------------------------

    let latestFrame = null;
    let displaying = false;

    function displayNext() {

        if (latestFrame === null) {
            displaying = false;
            return;
        }

        displaying = true;

        const frame = latestFrame;
        latestFrame = null;

        const blob = new Blob(
            [frame],
            { type: "image/jpeg" }
        );

        const url =
            URL.createObjectURL(blob);


        image.onload = () => {

            URL.revokeObjectURL(url);

            frames++;

            displayNext();
        };


        image.onerror = () => {

            URL.revokeObjectURL(url);

            displaying = false;
        };


        image.src = url;
    }


    // ------------------------------------------------------------
    // FPS
    // ------------------------------------------------------------

    let frames = 0;
    let lastFpsTime = performance.now();

    setInterval(() => {

        const now = performance.now();

        const elapsed =
            now - lastFpsTime;

        const fps =
            frames * 1000 / elapsed;

        stats.textContent =
            "FPS: " + fps.toFixed(1);

        frames = 0;
        lastFpsTime = now;

    }, 1000);


    // ------------------------------------------------------------
    // WEBSOCKET
    // ------------------------------------------------------------

    let socket = null;
    let reconnectTimer = null;


    function connect() {

        console.log(
            "Connecting to WebSocket..."
        );


        socket = new WebSocket(
            "ws://" + location.host + "/ws"
        );

        socket.binaryType =
            "arraybuffer";


        socket.onopen = () => {

            console.log(
                "WebSocket connected"
            );

            if (reconnectTimer !== null) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
        };


        socket.onmessage = (event) => {

            // Always keep only the newest frame.
            latestFrame = event.data;

            if (!displaying) {
                displayNext();
            }
        };


        socket.onclose = () => {

            console.log(
                "WebSocket disconnected"
            );

            scheduleReconnect();
        };


        socket.onerror = (error) => {

            console.error(
                "WebSocket error:",
                error
            );

            socket.close();
        };
    }


    function scheduleReconnect() {

        if (reconnectTimer !== null) {
            return;
        }

        reconnectTimer = setTimeout(() => {

            reconnectTimer = null;

            connect();

        }, 2000);
    }


    connect();

</script>

</body>
</html>
